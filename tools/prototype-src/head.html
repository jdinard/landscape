<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rootline AI design walkthrough</title>
<meta name="description" content="A clickable walkthrough of Rootline's agentic AI design flow: a homeowner's photos and real dimensions become region-correct, to-scale designs, an estimate, a proposal, client approval and downstream agent work, with humans approving along the way.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/rootline.css">
<style>
/* ---------- shell ---------- */
html { scroll-padding-top: 64px; }
body { overflow-x: hidden; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -40px; z-index: 60; background: var(--surface); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); }
.skip:focus { top: 8px; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ic { width: 15px; height: 15px; flex: none; display: inline-block; vertical-align: -3px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ic.s { width: 12px; height: 12px; vertical-align: -2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); }
.pt-shell { display: grid; grid-template-columns: 206px minmax(0, 1fr); align-items: start; }
.pt-rail { position: sticky; top: 53px; max-height: calc(100vh - 53px); overflow-y: auto; border-right: 1px solid var(--border); background: var(--surface-2); padding: 12px 10px 18px; font-size: .84rem; }
.pt-rail .rstart { display: flex; gap: 8px; align-items: center; padding: 7px 9px; border-radius: 8px; color: var(--text); text-decoration: none; font-weight: 650; }
.pt-rail .rall { display: flex; gap: 6px; align-items: center; padding: 4px 9px 8px; margin-bottom: 4px; border-bottom: 1px solid var(--border); color: var(--text-2); text-decoration: none; font-size: .78rem; font-weight: 600; }
.pt-rail .rall:hover { color: var(--text); }
.pt-rail .rall svg { width: 14px; height: 14px; }
.pt-rail .act { margin-top: 9px; }
.pt-rail .act-h { font-size: .68rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); padding: 0 9px 4px; line-height: 1.35; }
.pt-rail .act-h b { display: block; color: var(--clay-600); font-family: var(--font-mono); letter-spacing: .04em; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pt-rail .act-h b { color: var(--clay-300); } }
:root[data-theme="dark"] .pt-rail .act-h b { color: var(--clay-300); }
.pt-rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.pt-rail a.st { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 7px; align-items: center; padding: 4px 8px; border-radius: 7px; color: var(--text-2); text-decoration: none; line-height: 1.3; }
.pt-rail a.st:hover, .pt-rail .rstart:hover { background: var(--surface-3); color: var(--text); }
.pt-rail a.st .n { font-family: var(--font-mono); font-size: .7rem; font-weight: 600; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface); }
.pt-rail a.st.done .n { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-soft-text); }
.pt-rail a.st[aria-current="step"], .pt-rail .rstart[aria-current="step"] { background: var(--primary-soft); color: var(--primary-soft-text); font-weight: 650; }
.pt-rail a.st[aria-current="step"] .n { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.pt-rail .ai-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ai-solid); }
.pt-rail .rfoot { margin-top: 10px; padding: 8px 9px 0; border-top: 1px solid var(--border); color: var(--text-2); font-size: .76rem; }
.pt-rail .rfoot b { color: var(--ai-text); font-family: var(--font-mono); }
.meter { height: 6px; border-radius: 4px; background: var(--surface-3); overflow: hidden; margin-top: 6px; }
.meter i { display: block; height: 100%; background: var(--ai-solid); border-radius: 4px; }
.meter.ok i { background: var(--ok-solid); }
.pt-main { min-width: 0; padding: 12px 18px 48px; }
.pt-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 6px 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.pt-bar .where { min-width: 0; flex: 1 1 320px; }
.pt-bar .where .eyebrow { display: block; }
.pt-bar h1 { font-size: clamp(1.25rem, 2.1vw, 1.6rem); margin: 2px 0 0; }
.pt-bar h1:focus { outline: none; }
.pt-bar .ctrls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.prog { display: flex; align-items: center; gap: 8px; font-size: .78rem; color: var(--text-2); }
.prog .track { width: 120px; height: 6px; border-radius: 4px; background: var(--surface-3); overflow: hidden; }
.prog .track i { display: block; height: 100%; background: var(--primary); border-radius: 4px; transition: width .3s; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .5; cursor: not-allowed; }
.btn.xs { padding: 2px 8px; font-size: .74rem; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--surface-3); }
.pt-body { display: grid; grid-template-columns: minmax(0, 1fr) 334px; gap: 18px; align-items: start; }
.pt-screen { min-width: 0; }
.pt-bts { position: sticky; top: 66px; max-height: calc(100vh - 78px); overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); box-shadow: var(--shadow-1); }
.pt-bts.collapsed .bts-body { display: none; }
.bts-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: var(--surface-2); position: sticky; top: 0; z-index: 2; }
.bts-head h2 { font-family: var(--font-body); font-size: .9rem; font-weight: 700; margin: 0; flex: 1; }
.bts-body { padding: 4px 12px 14px; font-size: .82rem; }
.bts-sec { padding: 10px 0; border-bottom: 1px solid var(--border); }
.bts-sec:last-child { border-bottom: 0; }
.bts-sec > h3 { font-size: .66rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--text-3); margin: 0 0 6px; display: flex; gap: 6px; align-items: center; }
.bts-sec p { color: var(--text-2); }
.agent { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 7px; }
.agent .badge { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; background: var(--ai-bg); color: var(--ai-text); flex: none; border: 1px solid var(--ai-solid); }
.agent .badge.det { background: var(--surface-3); color: var(--text-2); border-color: var(--border-strong); }
.agent b { display: block; font-size: .83rem; }
.agent small { color: var(--text-3); font-size: .74rem; }
ol.trace { list-style: none; margin: 0; padding: 0; display: grid; gap: 5px; counter-reset: tr; }
ol.trace li { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 6px; align-items: start; padding: 5px 6px; border-radius: 6px; background: var(--surface-2); border: 1px solid transparent; }
ol.trace li .i { font-family: var(--font-mono); font-size: .66rem; color: var(--text-3); padding-top: 2px; }
ol.trace li code { font-family: var(--font-mono); font-size: .72rem; font-weight: 600; color: var(--ai-text); word-break: break-word; }
ol.trace li code.det { color: var(--text); }
ol.trace li .res { display: block; color: var(--text-2); font-size: .74rem; line-height: 1.4; margin-top: 1px; }
ol.trace li .ms { font-family: var(--font-mono); font-size: .66rem; color: var(--text-3); white-space: nowrap; padding-top: 2px; }
ol.trace li.pending { background: transparent; border: 1px dashed var(--border-strong); }
ol.trace li.pending code, ol.trace li.pending code.det { color: var(--text-2); font-weight: 500; }
ol.trace li.pending .res { visibility: hidden; }
ol.trace li.running { border-color: var(--ai-solid); background: var(--ai-bg); }
ol.trace li.human { background: var(--primary-soft); }
ol.trace li.human code { color: var(--primary-soft-text); }
.hitl { display: grid; gap: 6px; }
.hitl div { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 6px; color: var(--text-2); }
.hitl .ic { color: var(--primary); margin-top: 2px; }
.hitl b { color: var(--text); font-weight: 600; }
.lvl { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.cred { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: baseline; }
.cred .big { font-family: var(--font-mono); font-size: 1.25rem; font-weight: 600; color: var(--ai-text); }
.cred small { color: var(--text-3); font-size: .74rem; grid-column: 1 / -1; }
.specs { font-family: var(--font-mono); font-size: .7rem; color: var(--text-2); line-height: 1.6; }
.tagrow { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.tagrow .note { font-size: .74rem; color: var(--text-2); }
.pill .ic { width: 11px; height: 11px; }
.ai-mark .ic { color: var(--ai-solid); }

/* ---------- device frames ---------- */
.dev-row { display: flex; gap: 22px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
.phone.pt-phone { width: 352px; flex: none; }
.phone .status .bat { display: inline-flex; gap: 4px; align-items: center; }
.phone .body.pt-pbody { max-height: 680px; overflow-y: auto; overscroll-behavior: contain; gap: 10px; padding: 0 0 14px; position: relative; }
.pbody-pad { padding: 0 12px; display: flex; flex-direction: column; gap: 10px; }
.brand { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 3; }
.brand .logo { width: 26px; height: 26px; border-radius: 7px; background: var(--moss-700); color: var(--stone-0); display: grid; place-items: center; }
.brand .logo .ic { stroke: var(--stone-0); }
.brand b { font-size: .84rem; display: block; line-height: 1.1; }
.brand small { font-size: .68rem; color: var(--text-3); }
.brand .sp { flex: 1; }
.ptitle { font-family: var(--font-display); font-size: 1.35rem; font-weight: 600; line-height: 1.15; margin: 4px 0 0; }
.psub { color: var(--text-2); font-size: .84rem; }
.pcard { border: 1px solid var(--border); border-radius: 12px; padding: 10px 11px; background: var(--surface); }
.pcard.soft { background: var(--surface-2); }
.pcard h4 { margin: 0 0 4px; font-size: .84rem; }
.pfoot { font-size: .66rem; color: var(--text-3); text-align: center; padding: 4px 12px 0; }
.fld { display: grid; gap: 4px; font-size: .78rem; font-weight: 600; color: var(--text-2); }
.fld .hint { font-weight: 500; color: var(--text-3); font-size: .72rem; }
.inp { width: 100%; border: 1px solid var(--border-strong); border-radius: 8px; padding: 7px 9px; background: var(--surface); font-size: .86rem; font-weight: 500; color: var(--text); }
.inp.sm { padding: 5px 7px; font-size: .8rem; }
.inp[readonly] { background: var(--surface-2); }
.inrow { display: flex; gap: 6px; align-items: center; }
.inrow .inp { flex: 1; min-width: 0; }
.unit { position: relative; }
.unit .inp { padding-right: 30px; }
.unit span { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); font-size: .74rem; color: var(--text-3); pointer-events: none; }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 8px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 5px 10px; font-size: .76rem; font-weight: 600; color: var(--text-2); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--on-primary); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border: 1px solid var(--border-strong); border-radius: 999px; background: var(--surface); font-size: .76rem; font-weight: 600; color: var(--text-2); cursor: pointer; }
.chip[aria-pressed="true"], .chip[aria-checked="true"] { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-soft-text); }
.chip.ai { border-color: var(--ai-solid); background: var(--ai-bg); color: var(--ai-text); }
.chip.ai[disabled] { opacity: .55; cursor: default; }
.check { display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 7px; align-items: start; font-size: .74rem; color: var(--text-2); font-weight: 500; }
.check input { margin: 2px 0 0; width: 15px; height: 15px; accent-color: var(--primary); }
.okline { display: flex; gap: 6px; align-items: center; color: var(--ok-text); font-weight: 600; font-size: .78rem; }
.okline .ic { color: var(--ok-solid); }
.warnline { display: flex; gap: 6px; align-items: flex-start; color: var(--warn-text); font-weight: 600; font-size: .78rem; }
.kv { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 3px 10px; margin: 0; font-size: .78rem; }
.kv dt { color: var(--text-3); }
.kv dd { margin: 0; font-weight: 600; }
.loading { display: flex; gap: 8px; align-items: center; color: var(--text-2); font-size: .8rem; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--primary); animation: spin .8s linear infinite; }
.runitem .spin, .thumb .spin, ol.trace .spin { border-top-color: var(--ai-solid); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.rise { animation: rise .35s ease both; }

/* desktop frame */
.frame-scroll { overflow-x: auto; padding: 2px 2px 10px; -webkit-overflow-scrolling: touch; }
.frame-scroll > .browser { min-width: 760px; }
.pt-app { display: grid; grid-template-columns: 146px minmax(0, 1fr); min-height: 600px; font-size: .82rem; }
.pt-app .app-side { flex-direction: column; overflow: visible; border-right: 1px solid var(--border); border-bottom: 0; padding: 10px 7px; gap: 1px; font-size: .8rem; }
.pt-app .app-side .item { padding: 5px 8px; white-space: nowrap; gap: 7px; }
.pt-app .app-side .item .badge { margin-left: auto; font-size: .64rem; font-weight: 700; background: var(--clay-600); color: var(--stone-0); border-radius: 999px; padding: 0 6px; }
.pt-app .app-side .co { display: flex; gap: 7px; align-items: center; padding: 2px 4px 10px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
.pt-app .app-side .co .logo { width: 24px; height: 24px; border-radius: 6px; background: var(--moss-700); display: grid; place-items: center; flex: none; }
.pt-app .app-side .co .logo .ic { stroke: var(--stone-0); width: 14px; height: 14px; }
.pt-app .app-side .co b { font-size: .74rem; line-height: 1.15; display: block; }
.pt-app .app-side .co small { font-size: .64rem; color: var(--text-3); }
.pt-app .app-side .sidefoot { margin-top: auto; padding: 10px 6px 2px; font-size: .68rem; color: var(--text-2); border-top: 1px solid var(--border); }
.pt-app .app-side .sidefoot b { color: var(--ai-text); font-family: var(--font-mono); }
.pt-app .app-main { padding: 12px 14px; }
.apphead { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-bottom: 10px; }
.apphead h3 { font-size: 1rem; margin: 0; }
.apphead .crumb { font-size: .74rem; color: var(--text-3); width: 100%; }
.apphead .sp { flex: 1; }
.av { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; font-size: .62rem; font-weight: 700; color: var(--on-primary); background: var(--primary); border: 2px solid var(--surface); flex: none; }
.av.b { background: var(--clay-600); color: var(--stone-0); }
.av.c { background: var(--sky-600); color: var(--stone-0); }
.av.ai { background: var(--ai-solid); color: var(--stone-0); }
.panel { border: 1px solid var(--border); border-radius: var(--radius-m); background: var(--surface); padding: 10px 12px; }
.panel.soft { background: var(--surface-2); }
.panel h4 { margin: 0 0 6px; font-size: .82rem; display: flex; gap: 6px; align-items: center; }
.ph { font-size: .66rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-bottom: 6px; }
.ai-box { border: 1px solid var(--ai-solid); background: var(--ai-bg); border-radius: var(--radius-m); padding: 10px 12px; }
.ai-box .ai-h { display: flex; align-items: center; gap: 6px; color: var(--ai-text); font-weight: 700; font-size: .8rem; margin-bottom: 4px; }
.ai-box ul { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 3px; font-size: .78rem; color: var(--text); }
.cost { font-family: var(--font-mono); font-size: .72rem; color: var(--ai-text); font-weight: 600; white-space: nowrap; }
table.data.tight td, table.data.tight th { padding: 5px 7px; }
table.data td .sub { display: block; color: var(--text-3); font-size: .72rem; }
.stat { display: inline-flex; gap: 5px; align-items: center; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--border-strong); }
.dot.ok { background: var(--ok-solid); } .dot.warn { background: var(--warn-solid); } .dot.ai { background: var(--ai-solid); } .dot.info { background: var(--info-solid); }
.flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.tiny { font-size: .72rem; }
.mt6 { margin-top: 6px; } .mt10 { margin-top: 10px; } .mt14 { margin-top: 14px; }
.toast { display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 8px; background: var(--ok-bg); color: var(--ok-text); font-weight: 600; font-size: .8rem; }
.toast.ai { background: var(--ai-bg); color: var(--ai-text); }
.event { font-family: var(--font-mono); font-size: .7rem; padding: 1px 7px; border-radius: 4px; background: var(--surface-3); color: var(--text); border: 1px solid var(--border); }

/* ---------- photo scenes ---------- */
.scene { position: relative; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-3); }
.scene > svg, .ba-after > svg, .scene .lay > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ba { --pos: 50%; }
.ba-after { position: absolute; inset: 0; clip-path: inset(0 0 0 var(--pos)); }
.ba-line { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px; background: var(--stone-0); box-shadow: 0 0 0 1px color-mix(in srgb, var(--stone-900) 30%, transparent); pointer-events: none; z-index: 3; }
.ba-knob { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--stone-0); color: var(--stone-900); display: grid; place-items: center; font-size: .62rem; font-weight: 800; box-shadow: var(--shadow-2); }
.ba-tag { position: absolute; top: 8px; padding: 2px 8px; border-radius: 999px; font-size: .66rem; font-weight: 700; background: color-mix(in srgb, var(--stone-900) 82%, transparent); color: var(--stone-0); pointer-events: none; z-index: 4; }
.ba-tag.l { left: 8px; } .ba-tag.r { right: 8px; }
.ba-range { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: ew-resize; z-index: 5; }
.ba:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
.ai-badge { position: absolute; left: 8px; bottom: 8px; z-index: 6; display: inline-flex; gap: 5px; align-items: center; padding: 3px 9px; border-radius: 999px; font-size: .66rem; font-weight: 700; background: color-mix(in srgb, var(--stone-900) 84%, transparent); color: var(--stone-0); pointer-events: none; }
.ai-badge .ic { stroke: var(--iris-50); width: 11px; height: 11px; }
.plabel { position: absolute; z-index: 7; transform: translate(-50%, -100%); width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--stone-0); background: var(--stone-900); color: var(--stone-0); font-size: .68rem; font-weight: 800; display: grid; place-items: center; cursor: pointer; padding: 0; box-shadow: 0 1px 4px rgba(0,0,0,.35); transition: opacity .15s; }
.plabel:hover, .plabel.on { background: var(--primary); color: var(--on-primary); }
.plabel.hide { opacity: 0; pointer-events: none; }
.scene .stale { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); z-index: 6; }
.thumbs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.thumb { border: 2px solid var(--border); border-radius: 9px; padding: 0; background: var(--surface); cursor: pointer; overflow: hidden; text-align: left; display: grid; }
.thumb .scene { border: 0; border-radius: 0; aspect-ratio: 16/11; }
.thumb span { display: block; padding: 3px 5px 4px; font-size: .64rem; font-weight: 650; line-height: 1.2; color: var(--text-2); }
.thumb[aria-pressed="true"] { border-color: var(--primary); }
.thumb[aria-pressed="true"] span { color: var(--primary-soft-text); background: var(--primary-soft); }
.plist { display: grid; gap: 4px; }

/* ---------- overview ---------- */
.ov-hero { padding: 6px 0 16px; }
.ov-hero h2 { font-size: clamp(1.7rem, 3.2vw, 2.4rem); max-width: 22ch; }
.ov-hero .lede { margin-top: 10px; }
.ov-hero .flex { margin-top: 14px; }
.jm { display: grid; gap: 10px; margin-top: 6px; }
.jm-act { border: 1px solid var(--border); border-radius: var(--radius-l); background: var(--surface); padding: 10px 12px 12px; }
.jm-act .jh { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
.jm-act .jh b { font-family: var(--font-mono); font-size: .72rem; color: var(--accent); letter-spacing: .05em; }
.jm-act .jh span { font-weight: 650; font-size: .9rem; }
.jm-act .jh small { color: var(--text-3); font-size: .76rem; }
.jm-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px 14px; align-items: stretch; }
.jm-node { position: relative; display: grid; gap: 3px; align-content: start; min-width: 0; padding: 7px 7px 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); text-decoration: none; font-size: .72rem; line-height: 1.28; }
.jm-node::after { content: ""; position: absolute; right: -12px; top: 50%; width: 9px; height: 2px; background: var(--border-strong); }
.jm-node::before { content: ""; position: absolute; right: -13px; top: calc(50% - 3px); border: 4px solid transparent; border-left-color: var(--border-strong); border-right: 0; }
.jm-node.last::after, .jm-node.last::before { display: none; }
.jm-node:hover { border-color: var(--primary); background: var(--primary-soft); }
.jm-node .k { display: flex; gap: 5px; align-items: center; font-family: var(--font-mono); font-size: .66rem; color: var(--text-3); font-weight: 600; }
.jm-node .k .ai-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ai-solid); }
.jm-node b { font-size: .76rem; }
.jm-node .who { color: var(--text-3); font-size: .64rem; }
.jm-node .tag { justify-self: start; }
.cast { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.cast .card { padding: 12px; }
.cast .card h3 { font-size: .9rem; display: flex; gap: 7px; align-items: center; }
.cast ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: .78rem; color: var(--text-2); }
.cast li b { color: var(--text); font-weight: 600; }
.prop { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 14px; align-items: center; }
.prop svg { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--border); display: block; }
.sec-t { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; margin: 18px 0 8px; }

/* ---------- step-specific ---------- */
.capview { position: relative; }
.capview .chipo { position: absolute; z-index: 4; padding: 2px 8px; border-radius: 999px; font-size: .64rem; font-weight: 700; background: color-mix(in srgb, var(--stone-900) 78%, transparent); color: var(--stone-0); }
.capview .guide { position: absolute; inset: 13% 18% 22% 18%; border: 2px dashed var(--stone-0); border-radius: 6px; z-index: 3; pointer-events: none; }
