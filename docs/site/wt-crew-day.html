<style>
/* ---------- shell ---------- */

.flex { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

/* ---------- photo scenes ---------- */
.scene { position: relative; aspect-ratio: 16 / 10; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); background: var(--surface-3); }
.scene > svg, .ba-after > svg, .scene .lay > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

.ba-knob { position: absolute; top: 50%; left: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--stone-0); color: var(--stone-900); display: grid; place-items: center; font-size: .62rem; font-weight: 800; box-shadow: var(--shadow-2); }

/* ---------- overview ---------- */
.ov-hero { padding: 6px 0 16px; }
.ov-hero h2 { font-size: clamp(1.7rem, 3.2vw, 2.4rem); max-width: 22ch; }
.ov-hero .lede { margin-top: 10px; }
.ov-hero .flex { margin-top: 14px; }
.jm { display: grid; gap: 10px; margin-top: 6px; }
.jm-act { border: 1px solid var(--border); border-radius: var(--radius-l); background: var(--surface); padding: 10px 12px 12px; }
.jm-act .jh { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-bottom: 8px; }
.jm-act .jh b { font-family: var(--font-mono); font-size: .72rem; color: var(--accent); letter-spacing: .05em; }
.jm-act .jh span { font-weight: 650; font-size: .9rem; }
.jm-act .jh small { color: var(--text-3); font-size: .76rem; }
.jm-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px 14px; align-items: stretch; }
.jm-node { position: relative; display: grid; gap: 3px; align-content: start; min-width: 0; padding: 7px 7px 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--text); text-decoration: none; font-size: .72rem; line-height: 1.28; }
.jm-node::after { content: ""; position: absolute; right: -12px; top: 50%; width: 9px; height: 2px; background: var(--border-strong); }
.jm-node::before { content: ""; position: absolute; right: -13px; top: calc(50% - 3px); border: 4px solid transparent; border-left-color: var(--border-strong); border-right: 0; }
.jm-node.last::after, .jm-node.last::before { display: none; }
.jm-node:hover { border-color: var(--primary); background: var(--primary-soft); }
.jm-node .k { display: flex; gap: 5px; align-items: center; font-family: var(--font-mono); font-size: .66rem; color: var(--text-3); font-weight: 600; }
.jm-node .k .ai-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ai-solid); }
.jm-node b { font-size: .76rem; }
.jm-node .who { color: var(--text-3); font-size: .64rem; }
.jm-node .tag { justify-self: start; }
.cast { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.cast .card { padding: 12px; }
.cast .card h3 { font-size: .9rem; display: flex; gap: 7px; align-items: center; }
.cast ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 5px; font-size: .78rem; color: var(--text-2); }
.cast li b { color: var(--text); font-weight: 600; }
.prop { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 14px; align-items: center; }
.prop svg { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--border); display: block; }
.sec-t { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; margin: 18px 0 8px; }

/* ---------- step-specific ---------- */
.capview { position: relative; }
.capview .chipo { position: absolute; z-index: 4; padding: 2px 8px; border-radius: 999px; font-size: .64rem; font-weight: 700; background: color-mix(in srgb, var(--stone-900) 78%, transparent); color: var(--stone-0); }
.capview .guide { position: absolute; inset: 13% 18% 22% 18%; border: 2px dashed var(--stone-0); border-radius: 6px; z-index: 3; pointer-events: none; }

/* ---------- responsive ---------- */
@media (max-width: 1180px) {
  .pt-shell { grid-template-columns: minmax(0, 1fr); }
  .pt-rail { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--border); display: flex; gap: 6px 14px; overflow-x: auto; padding: 8px 12px; align-items: flex-start; }
  .pt-rail .act { margin-top: 0; flex: none; }
  .pt-rail ol { display: flex; gap: 2px; }
  .pt-rail a.st { grid-template-columns: 22px auto; white-space: nowrap; }
  .pt-rail a.st .ai-dot { display: none; }
  .pt-rail a.st .t { max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
  .pt-rail .rfoot { display: none; }
  .pt-rail .rstart { flex: none; margin-top: 14px; }
}
@media (max-width: 900px) {
  .jm-row { grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); }
  .jm-node::after, .jm-node::before { display: none; }
}
@media (max-width: 1100px) {
  .pt-body { grid-template-columns: minmax(0, 1fr); }
  .pt-bts { position: static; max-height: none; }
}
@media (max-width: 700px) {
  .pt-main { padding: 10px 10px 40px; }
  .phone.pt-phone { width: 100%; max-width: 352px; border-width: 8px; }
  .big-view { min-width: 0; flex-basis: 100%; }
  .prop { grid-template-columns: 1fr; }
  .pt-rail a.st .t { display: none; }
  .prog .track { width: 70px; }
}
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
@media print { .pt-rail, .pt-bar .ctrls { display: none; } }

.wt-gantt .g-blk { position: absolute; top: 2px; bottom: 2px; border-radius: 4px; background: var(--moss-200); color: var(--moss-900); padding: 0 5px; overflow: hidden; white-space: nowrap; font-weight: 600; display: flex; align-items: center; font-size: .66rem; }
.wt-gantt .g-blk.alt { background: var(--sky-100); color: var(--sky-700); } .wt-gantt .g-blk.warn { background: var(--marigold-100); color: var(--marigold-800); } .wt-gantt .g-blk.ai { background: var(--ai-bg); color: var(--ai-text); outline: 1.5px dashed var(--ai-solid); }
.wt-svg { width: 100%; height: auto; display: block; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); }
.wt-svg text { font-family: var(--font-body); }
.wt-note { font-size: .74rem; color: var(--text-3); }
.wt-callout { border-left: 3px solid var(--primary); background: var(--primary-soft); padding: 8px 10px; border-radius: 0 8px 8px 0; font-size: .78rem; }
.wt-callout.warn { border-color: var(--warn-solid); background: var(--warn-bg); }
.wt-callout.ai { border-color: var(--ai-solid); background: var(--ai-bg); }
.wt-callout.danger { border-color: var(--danger-solid); background: var(--danger-bg); }
.wt-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; cursor: pointer; }
.wt-toggle input { width: 30px; height: 17px; appearance: none; -webkit-appearance: none; background: var(--border-strong); border-radius: 999px; position: relative; cursor: pointer; margin: 0; }
.wt-toggle input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.wt-toggle input:checked { background: var(--primary); }
.wt-toggle input:checked::after { left: 15px; }
.wt-diff { font-family: var(--font-mono); font-size: .72rem; display: grid; gap: 2px; }
.wt-diff .add { color: var(--ok-text); background: var(--ok-bg); padding: 1px 5px; border-radius: 4px; }
.wt-diff .del { color: var(--danger-text); background: var(--danger-bg); padding: 1px 5px; border-radius: 4px; text-decoration: line-through; }
.wt-je { font-family: var(--font-mono); font-size: .74rem; width: 100%; border-collapse: collapse; }
.wt-je th, .wt-je td { padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: left; }
.wt-je td.n, .wt-je th.n { text-align: right; font-variant-numeric: tabular-nums; }
.wt-je tr.tot td { font-weight: 700; border-top: 2px solid var(--border-strong); }
.wt-sms { background: var(--surface-2); border-radius: 12px; padding: 10px; display: grid; gap: 6px; }
.wt-hide { display: none !important; }
@media (max-width: 760px) { .wt-cols, .wt-cols.c3, .wt-cols.wide-left { grid-template-columns: minmax(0, 1fr); } .wt-gantt .g-row { grid-template-columns: 84px minmax(0, 1fr); } }

.ai-box .faint, .wt-callout.ai .faint, .wt-row.ai .faint { color: var(--text-2); }

.pinpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.pinpad button { padding: 10px 0; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--surface); font-weight: 700; font-size: 1rem; cursor: pointer; min-height: 48px; }
.crewcard { display: grid; grid-template-columns: 40px minmax(0, 1fr) auto; gap: 9px; align-items: center; padding: 9px 10px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); min-height: 60px; width: 100%; text-align: left; cursor: pointer; font: inherit; color: inherit; }
.crewcard.on { border-color: var(--primary); background: var(--primary-soft); }
.crewcard .avb { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--surface-3); }
.crewcard.on .avb { background: var(--primary); color: var(--on-primary); }
.bigbtn { min-height: 56px; justify-content: center; font-size: .95rem; }
.qbox { border: 2px dashed var(--border-strong); border-radius: 12px; padding: 10px; display: grid; gap: 4px; place-items: center; text-align: center; font-size: .78rem; color: var(--text-2); }
.gate-code { font-family: var(--font-mono); font-size: 1.6rem; font-weight: 700; letter-spacing: .2em; }
.wind { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center; }
.wind div { border: 1px solid var(--border); border-radius: 10px; padding: 6px 4px; background: var(--surface); font-size: .7rem; color: var(--text-3); }
.wind b { display: block; font-size: 1rem; color: var(--text); font-variant-numeric: tabular-nums; }
.wind .bad { border-color: var(--danger-solid); background: var(--danger-bg); }
.wind .bad b { color: var(--danger-text); }
.queue li { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 6px; font-size: .76rem; padding: 4px 0; border-bottom: 1px solid var(--border); }
.queue { list-style: none; margin: 0; padding: 0; }
.bedrow { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 8px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); font-size: .78rem; }
.bedrow b.k { font-family: var(--font-mono); }
.prog-bar { height: 8px; border-radius: 5px; background: var(--surface-3); overflow: hidden; }
.prog-bar i { display: block; height: 100%; background: var(--primary); }
.snowsite { fill: var(--stone-200); }
.snowlot { fill: var(--sky-50); stroke: var(--sky-500); stroke-width: 1.5; }
.snowpri { fill: var(--accent); }

  el.innerHTML = '<div class="bts-head"><span class="ai-mark">' + ic('spark') + '</span><h2>Behind the scenes</h2><button type="button" class="btn xs" data-act="bts" data-k="bts" aria-expanded="' + btsOpen + '" aria-controls="bts-body">' + (btsOpen ? 'Hide' : 'Show') + '</button></div><div class="bts-body" id="bts-body">' + btsHTML() + '</div>';
}

/* ---------- overview ---------- */
function overviewHTML() {
  var o = WT.ov;
  var jm = WT.acts.map(function (a, ai) {
    var steps = STEPS.filter(function (s) { return s.act === ai; });
    var nodes = steps.map(function (s, j) {
      var i = stepIndex(s.id);
      return '<a class="jm-node' + (j === steps.length - 1 ? ' last' : '') + '" href="#' + s.id + '"><span class="k">' + (i < 10 ? '0' + i : i) + (s.ai ? '<span class="ai-dot" role="img" aria-label="AI step"></span>' : '') + '</span><b>' + esc(s.short) + '</b><span class="who">' + esc(s.who || '') + '</span>' + (s.tags || []).map(tag).join(' ') + '</a>';
    }).join('');
    return '<div class="jm-act"><div class="jh"><b>' + esc(a.n.toUpperCase()) + '</b><span>' + esc(a.t) + '</span><small>' + esc(a.sub || '') + '</small></div><div class="jm-row">' + nodes + '</div></div>';
  }).join('');
  var cast = (o.cast || []).map(function (c) { return '<div class="card"><h3>' + ic(c.icon || 'user') + esc(c.h) + '</h3><ul>' + c.items.map(function (x) { return '<li><b>' + esc(x[0]) + '</b> ' + esc(x[1]) + '</li>'; }).join('') + '</ul></div>'; }).join('');
  return '<div class="ov-hero"><p class="eyebrow">' + esc(o.eyebrow) + '</p><h2>' + esc(o.h) + '</h2><p class="lede">' + o.lede + '</p><div class="flex"><a class="btn primary" href="#' + STEPS[1].id + '" data-k="ov-start">Start walkthrough ' + ic('arrow-r') + '</a><span class="muted small">' + (STEPS.length - 1) + ' steps · use the ← → keys</span></div></div>' +
    '<h3 class="sec-t">The journey</h3><div class="jm">' + jm + '</div>' +
    (cast ? '<h3 class="sec-t">The cast</h3><div class="cast">' + cast + '</div>' : '') + (o.extra || '');
}

/* ---------- screen and routing ---------- */
function renderScreen() {
  var el = $('#screen'), keep = {};
  $$('[data-keep]', el).forEach(function (n) { keep[n.getAttribute('data-keep')] = n.scrollTop; });
  el.innerHTML = current === 'overview' ? (WT.overview ? WT.overview(S) : overviewHTML()) : (WT.screens[current] ? WT.screens[current](S) : '');
  $$('[data-keep]', el).forEach(function (n) { var k = n.getAttribute('data-keep'); if (keep[k] != null) n.scrollTop = keep[k]; });
}
function update() {
  var a = document.activeElement, k = a && a.getAttribute ? a.getAttribute('data-k') : null;
  var sel = a && typeof a.selectionStart === 'number' ? [a.selectionStart, a.selectionEnd] : null;
  renderScreen(); renderBTS(); renderRail(); renderBar();
  if (k) { var n = document.querySelector('[data-k="' + k + '"]'); if (n && !n.disabled) { try { n.focus({ preventScroll: true }); } catch (e) { n.focus(); } if (sel && n.setSelectionRange) { try { n.setSelectionRange(sel[0], sel[1]); } catch (e) {} } } }
}
function go(id, src) { navSource = src || 'link'; if (location.hash.slice(1) === id) route(); else location.hash = id; }
function route() {
  var id = (location.hash || '').replace(/^#/, '');
  if (id !== 'overview' && !WT.screens[id]) id = 'overview';
  var changed = id !== current;
  if (changed) clearTimers();
  var idx = stepIndex(id);
  if (WT.ensure) for (var i = 1; i < idx; i++) { var f = WT.ensure[STEPS[i].id]; if (f) f(S); }
  visited[id] = true; current = id;
  renderScreen(); renderBTS(); renderRail(); renderBar();
  document.title = (id === 'overview' ? '' : STEPS[idx].short + ' · ') + WT.title;
  if (changed) {
    var top = $('#main'); if (top && window.scrollY > top.offsetTop - 60) window.scrollTo(0, Math.max(0, top.offsetTop - 60));
    if (navSource === 'button') { var b = document.querySelector('[data-k="next"]'); if (b && !b.disabled) b.focus({ preventScroll: true }); }
    else if (navSource !== 'load') { var hh = $('#step-h'); if (hh) hh.focus({ preventScroll: true }); }
    if (WT.enter && WT.enter[id]) WT.enter[id](S);
  }
  navSource = 'link';
}
function nav(d) { var i = stepIndex(current) + d; if (i < 0 || i >= STEPS.length) return; go(STEPS[i].id, 'button'); }

/* ---------- events ---------- */
document.addEventListener('click', function (e) {
  var t = e.target.closest ? e.target.closest('[data-act],[data-go]') : null; if (!t) return;
  if (t.hasAttribute('data-go')) { e.preventDefault(); go(t.getAttribute('data-go'), 'link'); return; }
  var a = t.getAttribute('data-act');
  if (a === 'prev') return nav(-1);
  if (a === 'next') return nav(1);
  if (a === 'bts') { btsOpen = !btsOpen; renderBTS(); var bb = document.querySelector('[data-k="bts"]'); if (bb) bb.focus(); return; }
  if (a === 'theme') { theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length]; try { localStorage.setItem('rootline-proto-theme', theme); } catch (er) {} applyTheme(); renderBar(); var tb = document.querySelector('[data-k="theme"]'); if (tb) tb.focus(); return; }
  if (WT.actions && WT.actions[a]) { e.preventDefault(); var r = WT.actions[a](t, S, e); if (r !== false) update(); }
});
function onInput(e) {
  var t = e.target; if (!t.getAttribute) return; var k = t.getAttribute('data-in'); if (!k || !WT.inputs || !WT.inputs[k]) return;
  var live = t.type === 'range' || t.type === 'checkbox' || t.type === 'radio' || t.tagName === 'SELECT';
  if (e.type === 'input' && !live && t.getAttribute('data-live') == null) return;
  var r = WT.inputs[k](t, S, e); if (r !== false) update();
}
document.addEventListener('input', onInput);
document.addEventListener('change', onInput);
document.addEventListener('submit', function (e) { e.preventDefault(); var f = e.target.getAttribute('data-submit'); if (f && WT.actions && WT.actions[f]) { WT.actions[f](e.target, S, e); update(); } });
document.addEventListener('keydown', function (e) {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  var t = e.target, tn = t && t.tagName;
  if (tn === 'INPUT' || tn === 'TEXTAREA' || tn === 'SELECT' || (t && t.isContentEditable) || (t && t.getAttribute && t.getAttribute('role') === 'slider')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); nav(1); } else if (e.key === 'ArrowLeft') { e.preventDefault(); nav(-1); }
});
window.addEventListener('hashchange', route);
route();

</script>
